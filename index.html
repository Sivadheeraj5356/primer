    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Primer - an adaptive tutor for young children: reading, writing, and arithmetic." />
    <title>Primer - a patient tutor for young learners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Andika:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@20..48,400&display=block" rel="stylesheet" />
      <script>
      // Restore the path stashed by 404.html on static hosts without SPA rewrites.
      (function () {
        var p = sessionStorage.getItem('primer:redirect')
        if (p && p !== '/') {
          sessionStorage.removeItem('primer:redirect')
          history.replaceState(null, '', p)
        }
      })()
    </script>
</head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
